name: Feature Store Backfill

on:
  # ── Weekly schedule: Sunday 2am UTC ────────────────────────────────────────
  schedule:
    - cron: '0 2 * * 0'

  # ── Manual trigger with custom date range ──────────────────────────────────
  workflow_dispatch:
    inputs:
      feature:
        description: 'Feature name or "all"'
        required: true
        default: 'all'
      start:
        description: 'Start date (YYYY-MM-DD or "7daysago")'
        required: true
        default: '7daysago'
      end:
        description: 'End date (YYYY-MM-DD or "today")'
        required: true
        default: 'today'
      dry_run:
        description: 'Dry run (compute but do not write to DB)'
        type: boolean
        required: false
        default: false

jobs:
  # ── Job 1: Run tests before any backfill ───────────────────────────────────
  test-backfill:
    name: Test backfill package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: saas/services/features
        run: pip install -r backfill/requirements.txt

      - name: Run tests
        working-directory: saas/services/features
        run: pytest backfill/tests/ -v --tb=short --cov=backfill --cov-report=term-missing

  # ── Job 2: Run backfill against Railway PostgreSQL ─────────────────────────
  run-backfill:
    name: Run feature backfill
    runs-on: ubuntu-latest
    needs: test-backfill
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: saas/services/features
        run: pip install -r backfill/requirements.txt

      - name: Run backfill (scheduled — last 7 days, all features)
        if: github.event_name == 'schedule'
        working-directory: saas/services/features
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m backfill.run \
            --feature all \
            --start 7daysago \
            --end today

      - name: Run backfill (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: saas/services/features
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m backfill.run \
            --feature ${{ github.event.inputs.feature }} \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Verify feature freshness post-backfill
        if: github.event.inputs.dry_run != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PYEOF'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()

          # Check that feature_values were written in the last hour
          cur.execute("""
              SELECT COUNT(*) FROM feature_values
              WHERE created_at > NOW() - INTERVAL '1 hour'
          """)
          count = cur.fetchone()[0]
          print(f"✔ Rows written in last hour: {count}")

          # Check feature registry has entries
          cur.execute("SELECT COUNT(*) FROM feature_registry WHERE deleted_at IS NULL")
          features = cur.fetchone()[0]
          print(f"✔ Registered features: {features}")

          conn.close()

          if count == 0:
              print("⚠ Warning: no rows written — check if features are registered for any org")
          PYEOF
