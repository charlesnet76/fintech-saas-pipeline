name: Build & Deploy to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  RESOURCE_GROUP: fintech-saas-rg
  CONTAINER_APP_ENV: fintech-saas-env
jobs:
  build-auth:
    name: Build auth service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: saas/services/auth
          file: saas/services/auth/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:${{ github.sha }}
  build-ai:
    name: Build AI service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: saas/services/ai
          file: saas/services/ai/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/ai-service:${{ github.sha }}
  build-pipeline:
    name: Build pipeline service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: saas/services/pipeline
          file: saas/services/pipeline/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-service:${{ github.sha }}
  build-features:
    name: Build features service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: saas/services/features
          file: saas/services/features/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/features-service:${{ github.sha }}
  build-monitor:
    name: Build monitor service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: saas/services/monitor
          file: saas/services/monitor/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/monitor-service:${{ github.sha }}  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build-auth, build-ai, build-pipeline, build-features, build-monitor]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade -y
      - name: Create environment
        run: |
          az containerapp env create \
            --name ${{ env.CONTAINER_APP_ENV }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location canadacentral 2>/dev/null || echo "exists"
      - name: Deploy all services
        run: |
          for svc in "auth-service:8081:0.25:0.5Gi" "ai-service:8085:0.25:0.5Gi" "pipeline-service:8086:0.5:1.0Gi" "features-service:8087:0.25:0.5Gi" "monitor-service:8088:0.25:0.5Gi"; do
            name=$(echo $svc | cut -d: -f1)
            port=$(echo $svc | cut -d: -f2)
            cpu=$(echo $svc | cut -d: -f3)
            mem=$(echo $svc | cut -d: -f4)
            image=${{ secrets.ACR_LOGIN_SERVER }}/${name}:${{ github.sha }}
            az containerapp create --name $name \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_APP_ENV }} \
              --image $image \
              --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
              --registry-username ${{ secrets.ACR_USERNAME }} \
              --registry-password ${{ secrets.ACR_PASSWORD }} \
              --target-port $port --ingress external \
              --min-replicas 0 --max-replicas 2 \
              --cpu $cpu --memory $mem 2>/dev/null || \
            az containerapp update --name $name \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image $image
          done
      - name: Print live URLs
        run: |
          echo "=== Live Azure URLs ==="
          for svc in auth-service ai-service pipeline-service features-service monitor-service; do
            echo "$svc: $(az containerapp show --name $svc --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          done