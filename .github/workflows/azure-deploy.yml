name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: fintech-saas-rg
  CONTAINER_APP_ENV: fintech-saas-env

jobs:
  # ── Job 1: Build and push all images to ACR ───────────────────────────────
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: auth
            context: saas/services/auth
            dockerfile: saas/services/auth/Dockerfile
            image: auth-service
            port: 8081
          - name: ai
            context: saas/services/ai
            dockerfile: saas/services/ai/Dockerfile
            image: ai-service
            port: 8085
          - name: pipeline
            context: saas/services/pipeline
            dockerfile: saas/services/pipeline/Dockerfile
            image: pipeline-service
            port: 8086

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.image }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.image }}:${{ github.sha }}

  # ── Job 2: Deploy to Azure Container Apps ────────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Container Apps environment (if not exists)
        run: |
          az containerapp env create \
            --name ${{ env.CONTAINER_APP_ENV }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location canadacentral \
            2>/dev/null || echo "Environment already exists"

      - name: Deploy auth-service
        run: |
          az containerapp create \
            --name auth-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8081 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --env-vars \
              DATABASE_URL=secretref:database-url \
              JWT_ACCESS_SECRET=secretref:jwt-access-secret \
              JWT_REFRESH_SECRET=secretref:jwt-refresh-secret \
            2>/dev/null || \
          az containerapp update \
            --name auth-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/auth-service:${{ github.sha }}

      - name: Deploy ai-service
        run: |
          az containerapp create \
            --name ai-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/ai-service:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8085 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 2 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --env-vars \
              DATABASE_URL=secretref:database-url \
              ANTHROPIC_API_KEY=secretref:anthropic-api-key \
            2>/dev/null || \
          az containerapp update \
            --name ai-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/ai-service:${{ github.sha }}

      - name: Deploy pipeline-service
        run: |
          az containerapp create \
            --name pipeline-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-service:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8086 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 2 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --env-vars \
              DATABASE_URL=secretref:database-url \
            2>/dev/null || \
          az containerapp update \
            --name pipeline-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/pipeline-service:${{ github.sha }}

      - name: Get live URLs
        run: |
          echo "=== Live URLs ==="
          echo "Auth service:"
          az containerapp show --name auth-service --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv
          echo "AI service:"
          az containerapp show --name ai-service --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv
          echo "Pipeline service:"
          az containerapp show --name pipeline-service --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv
