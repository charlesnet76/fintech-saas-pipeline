[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fintech-feature-backfill"
version = "1.0.0"
description = "Feature store backfill job for fintech-saas-pipeline"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
backfill = "backfill.run:main"

[tool.pytest.ini_options]
testpaths = ["backfill/tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backfill"]
omit = ["backfill/tests/*"]
