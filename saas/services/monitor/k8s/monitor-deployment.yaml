# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshness-monitor
  labels:
    app: freshness-monitor
    tier: observability
spec:
  replicas: 1  # Only need one instance — it's a monitor, not a serving layer
  selector:
    matchLabels:
      app: freshness-monitor
  template:
    metadata:
      labels:
        app: freshness-monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: freshness-monitor
          image: ghcr.io/charlesnet76/fintech-saas/monitor:latest
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: CHECK_INTERVAL
              value: "5m"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: database-url
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: slack-webhook-url
                  optional: true  # Monitor works without Slack — just logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: freshness-monitor
  labels:
    app: freshness-monitor
spec:
  selector:
    app: freshness-monitor
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP
